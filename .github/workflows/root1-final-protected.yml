name: VM7 Root1 fresh protected consumer 261019

on:
  push:
    branches:
      - vm7-root1-final-sensitive-261019
    paths:
      - deploy-vm7-root1-final.sh

permissions:
  contents: read

jobs:
  protected-consumer:
    runs-on: ubuntu-latest
    environment: vm7-root1-final-env-261019
    env:
      VM7_ROOT1_FINAL_SECRET: ${{ secrets.VM7_ROOT1_FINAL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected deployment hook
        run: bash deploy-vm7-root1-final.sh
      - name: Upload controlled protected output
        uses: actions/upload-artifact@v4
        with:
          name: vm7-root1-final-protected-output-261019
          path: protected-output.bin
          if-no-files-found: error
